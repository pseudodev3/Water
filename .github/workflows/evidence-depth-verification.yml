name: Evidence depth verification

on:
  push:
    branches: [feature/evidence-depth-pass]

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  provider-shapes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public metadata/origin shapes
        shell: python
        run: |
          import json, time, urllib.request

          UA = {"User-Agent":"water-evidence-depth/0.1","Accept":"application/json"}
          WETH = "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          PUMP = "pumpCmXqMfrsAkQ5r49WcJnRayYRqmXz6ae8H7H9Dfn"

          def req(url, data=None, headers=None, attempts=3):
              merged = dict(UA)
              if headers:
                  merged.update(headers)
              last = None
              for attempt in range(attempts):
                  try:
                      request = urllib.request.Request(
                          url,
                          data=json.dumps(data).encode() if data is not None else None,
                          headers={**merged, **({"Content-Type":"application/json"} if data is not None else {})},
                          method="POST" if data is not None else "GET",
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(1 + attempt)
              raise RuntimeError(last)

          info = req(
              f"https://api.geckoterminal.com/api/v2/networks/robinhood/tokens/{WETH}/info",
              headers={"Accept":"application/json;version=20230203"},
          )
          attrs = info.get("data", {}).get("attributes", {})
          assert isinstance(attrs.get("websites", []), list), attrs
          assert "twitter_handle" in attrs, attrs

          sol = "https://api.mainnet-beta.solana.com"
          try:
              sigs = req(sol, {
                  "jsonrpc":"2.0","id":1,"method":"getSignaturesForAddress",
                  "params":[PUMP, {"limit": 3}]
              })
              assert isinstance(sigs.get("result"), list), sigs
          except RuntimeError as exc:
              if "429" not in str(exc):
                  raise

          print("New provider shapes verified.")
