name: Long evidence probe
on:
  push:
    branches: [feat/rh-launchpad-coverage]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - shell: python
        run: |
          import json, urllib.request, time
          RPC="https://rpc.mainnet.chain.robinhood.com"
          def rpc(method,params):
              req=urllib.request.Request(RPC,data=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode(),headers={"Content-Type":"application/json","User-Agent":"water-live-smoke/0.1"})
              with urllib.request.urlopen(req,timeout=15) as r: return json.load(r)
          launcher="0x22e99278308b393ea1260859b181ad7e78f5eeed"
          topic="0xadc6f1f726f7c710f77ec06adc75f3bb964e5be19581b072c67f7b9b4039267b"
          import concurrent.futures
          head=int(rpc("eth_blockNumber",[])["result"],16)
          token="0x2E8c31162b855A2ffa90F6F8634643Ad6F111e18"
          print("code",json.dumps(rpc("eth_getCode",[token,"latest"])),flush=True)
          def chunk(start):
              before=time.monotonic()
              try:
                  result=rpc("eth_getLogs",[{"address":launcher,"fromBlock":hex(start),"toBlock":hex(min(head,start+9999999)),"topics":[topic,None,"0x"+token[2:].lower().zfill(64)]}])
                  print("chunk",start,round(time.monotonic()-before,2),json.dumps(result),flush=True)
              except Exception as e: print("chunk",start,str(e),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: list(pool.map(chunk,range(8636038,head+1,10000000)))
          
