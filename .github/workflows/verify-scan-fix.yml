name: Verify scan fixes before PR
on:
  push:
    branches: [fix/scan-evidence-reliability]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --workspace
      - name: Start candidate backend
        run: |
          target/debug/water-core > /tmp/water-core.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify real factory membership and bounded scans
        shell: python
        run: |
          import json, urllib.request, time
          def request(url, payload):
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req, timeout=18) as r: return json.load(r)
          token = "0x39dBED3a2bd333467115dE45665cC57F813C4571"
          pons = request("http://127.0.0.1:8080/v1/origin", {"chain":"robinhood","token":token})
          print("Pons origin", json.dumps(pons))
          assert pons.get("launchpad", {}).get("slug") == "pons", pons
          assert pons["launchpad"]["source"] == "Robinhood verified factory registry", pons
          rpc_url = "https://rpc.mainnet.chain.robinhood.com"
          def rpc(method, params):
              result = request(rpc_url, {"jsonrpc":"2.0","id":1,"method":method,"params":params})
              assert "error" not in result, result
              return result["result"]
          v1_topic = "0xdb51ea9ad51ab453a65a4cb7e60c3cb378c9501bb002609f8f97778fb6c4235a"
          for label, factory, block in [
              ("noxa", "0xD9eC2db5f3D1b236843925949fe5bd8a3836FCcB", 61688),
              ("pons", "0xA5aAb3F0c6EeadF30Ef1D3Eb997108E976351feB", 8991118),
          ]:
              logs = rpc("eth_getLogs", [{"address":factory,"fromBlock":hex(block),"toBlock":hex(block+2000),"topics":[v1_topic]}])
              assert logs, (label, "no launch sample in reference window")
              sample = "0x" + logs[0]["topics"][1][-40:]
              result = request("http://127.0.0.1:8080/v1/origin", {"chain":"robinhood","token":sample})
              print("FACTORY SAMPLE", label, sample, json.dumps(result))
              assert result.get("launchpad", {}).get("slug") == label, result
          head = int(rpc("eth_blockNumber", []), 16)
          v2_factory = "0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e"
          v2_topic = "0x8d4aad4953d0ca700d468f3753aa14432d1b35b43ec6409f051fb6aa43a89607"
          logs = []
          for offset in range(0, 20000, 2000):
              logs = rpc("eth_getLogs", [{"address":v2_factory,"fromBlock":hex(max(0,head-offset-1999)),"toBlock":hex(head-offset),"topics":[v2_topic]}])
              if logs: break
          assert logs, "No recent Pons v2 launch sample found"
          sample = "0x" + logs[0]["topics"][1][-40:]
          result = request("http://127.0.0.1:8080/v1/origin", {"chain":"robinhood","token":sample})
          print("FACTORY SAMPLE pons v2", sample, json.dumps(result))
          assert result.get("launchpad", {}).get("slug") == "pons", result
          weth = "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
          negative = request("http://127.0.0.1:8080/v1/origin", {"chain":"robinhood","token":weth})
          assert negative["launchpad"] is None, negative
          for chain, address in [("robinhood",token),("solana","So11111111111111111111111111111111111111112")]:
              start = time.monotonic()
              result = request("http://127.0.0.1:8080/v1/scan", {"chain":chain,"address":address})
              elapsed = time.monotonic() - start
              print("SCAN",chain,round(elapsed,2),json.dumps(result))
              assert elapsed < 16, elapsed
              cap = result["token"]["market_cap_usd"]
              assert cap is None or cap > 0, result
              assert result["token"]["price_usd"] is not None, result
